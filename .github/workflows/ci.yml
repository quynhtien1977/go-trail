name: CI Quality Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Verify concurrent assignments (disposable local PostgreSQL)
        run: npm run test:assignments:concurrency

      - name: Verify concurrent bookings (disposable local PostgreSQL)
        run: npm run test:bookings:concurrency

      - name: Build production bundle
        run: npm run build

      - name: Verify five-role HTTP RBAC matrix (isolated database, no external secrets)
        run: npm run test:rbac:http

      - name: Verify dependency audit baseline
        run: npm run audit:check
